<h1>Skills</h1>
<p class="intro">Core skills marked <span aria-label="core skill" role="img">★</span>. Select a skill to see the projects that use it.</p>

<div class="grid">
  @for (g of groups(); track g.id) {
    <section class="group" [attr.aria-labelledby]="'skills-' + g.id">
      <h2 [id]="'skills-' + g.id">{{ g.label }}</h2>
      <ul class="chips">
        @for (s of g.skills; track s.name) {
          <li [class.core]="s.core">
            @if (s.linked) {
              <a [routerLink]="['/projects']" [queryParams]="{ tech: s.name }">
                <ng-container *ngTemplateOutlet="chip; context: { $implicit: s }" />
              </a>
            } @else {
              <ng-container *ngTemplateOutlet="chip; context: { $implicit: s }" />
            }
          </li>
        }
      </ul>
    </section>
  }
</div>

<ng-template #chip let-s>
  <app-chip [version]="s.years ? '· ' + s.years + 'y' : undefined">
    @if (s.core) {
      <span aria-label="core skill" role="img">★</span>&#32;
    }{{ s.name }}
  </app-chip>
</ng-template>

<p class="more"><a routerLink="/projects">See these in action → Projects</a></p>
